[project]
name = "studio-growth-os-api"
version = "2.0.0"
description = "Studio Growth OS - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "pydantic==2.8.0",
    "pydantic-settings==2.3.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "prisma==0.12.0",
    "redis==5.0.0",
    "httpx==0.27.0",
    "openai==1.35.0",
    "anthropic==0.28.0",
    "langgraph==0.1.0",
    "langchain-core==0.2.0",
    "razorpay==1.4.0",
    "google-auth==2.29.0",
    "google-auth-oauthlib==1.2.0",
    "google-auth-httplib2==0.2.0",
    "google-api-python-client==2.120.0",
    "google-cloud-storage==2.16.0",
    "apscheduler==3.10.4",
    "celery==5.3.6",
    "flower==2.0.1",
    "structlog==24.1.0",
    "python-dotenv==1.0.1",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
dev-dependencies = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.0",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==25.1.0",
    "black==24.4.0",
    "ruff==0.4.0",
    "mypy==1.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C4", "PIE"]
ignore = ["E501", "C408"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true