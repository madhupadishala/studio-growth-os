name: RunGrow Adapter Contract
on:
  push:
    branches: [feat/rungrow-workforce-adapter-v1]
  pull_request:
    branches: [main, feat/rungrow-workforce-adapter-v1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-auth-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated auth test dependencies
        run: python -m pip install pytest fastapi pydantic-settings
      - name: Verify HMAC signature, replay window, product binding and tenant mapping
        env:
          PYTHONPATH: apps/api
        run: pytest -q apps/api/tests/test_rungrow_auth.py
      - name: Compile API auth modules
        run: python -m compileall -q apps/api/core
