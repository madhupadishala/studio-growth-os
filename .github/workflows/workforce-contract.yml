name: Workforce Contract CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/rungrow-workforce-adapter-v1]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  api-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest pytest-asyncio httpx email-validator
      - run: pytest -q --junitxml=workforce-contract-results.xml
